services:
  - type: web
    name: ecto-medevac-service
    env: python
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
